[project]
name = "lightfiles"
version = "0.1.0"
description = ""
authors = [
    { name = "Duvakin Andrei", email = "andrei@duvakin.ru" }
]
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "wtforms (>=3.2.2,<4.0.0)",
    "random-password-generator (==2.2.0)",
    "quart (>=0.23.1,<0.24.0)",
    "quart-auth (>=0.12.0,<0.13.0)",
    "quart-wtforms (>=1.0.3,<2.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8-import-order (>=0.19.2,<0.20.0)",
    "flake8-bugbear (>=26.9.30,<27.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "constants.py",
]
per-file-ignores = [
    "__init__.py:F401",
    "__init__.py:F402",
]

# flake8-import-order
import-order-style = "google"
application-import-names = ["app"]

[tool.ruff]
select = ["F", "I"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "E402"]

# flake8-bugbear
extend-select = ["B"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | __pycache__
  | build
  | dist
)/
'''