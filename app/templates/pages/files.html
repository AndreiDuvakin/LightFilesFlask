{% extends "base.html" %}

{% block title %}LightFiles - Просмотр файлов{% endblock %}

{% block content %}

<div class="container m-4">
    <div class="row align-items-start">
        {% if current_user.is_authenticated %}
        <div class="col">
            <a href="{{ url_for('upload.upload_page') }}" type="button" class="btn-outline theme-primary">
                Загрузить файл
            </a>
            <a
                type="button"
                class="btn-subtle theme-danger"
                href="{{ url_for('logout.logout') }}"
            >
                Выйти
            </a>
        </div>
        {% else %}
        <div class="col">
            <a
                type="button"
                class="btn-outline theme-primary"
                href="{{ url_for('login.login_page') }}"
            >
                Войти
            </a>
        </div>
        {% endif %}
    </div>
    <h3 class="mt-3">
        Файлы:
    </h3>
</div>

{% endblock %}
